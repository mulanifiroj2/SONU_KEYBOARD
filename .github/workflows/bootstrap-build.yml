name: SONU KEYBOARD APK BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONU_KEYBOARD_PROJECT.zip'
      - '.github/workflows/bootstrap-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          unzip -q SONU_KEYBOARD_PROJECT.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONU-KEYBOARD-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
